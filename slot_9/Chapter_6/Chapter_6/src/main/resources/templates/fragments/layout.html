<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Student Management</title>

    <!-- Thêm thư viện Bootstrap 5 + Bootstrap Icons từ thư mục vendor -->
    <link th:href="@{/vendor/bootstrap/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}" rel="stylesheet"/>

    <!-- File CSS riêng của dự án (Nên để dưới cùng để dễ dàng ghi đè CSS của Bootstrap nếu cần) -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand navbar-dark bg-dark px-3">
    <a th:href="@{/students}" class="navbar-brand">
        <i class="bi bi-mortarboard-fill"></i> Student Management
    </a>
    <div class="navbar-nav ms-auto">
        <a th:href="@{/students}" class="nav-link">Danh sách</a>
        <a th:href="@{/students/top}" class="nav-link">Top GPA</a>
        <a th:href="@{/students/new}" class="btn btn-primary btn-sm ms-2">
            <i class="bi bi-plus-lg"></i> Thêm mới
        </a>
    </div>
</nav>
<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
