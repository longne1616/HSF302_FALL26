<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Form sinh viên')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="container">
    <h2 th:text="${formTitle}">Thêm sinh viên</h2>

    <form th:action="@{/students/save}" th:object="${student}" method="post" class="form">
        <!-- id ẩn: có giá trị khi sửa, null khi thêm -->
        <input type="hidden" th:field="*{id}">

        <label>Tên</label>
        <input type="text" th:field="*{name}">
        <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>

        <label>Email</label>
        <input type="text" th:field="*{email}">
        <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label>Tuổi</label>
        <input type="number" th:field="*{age}">
        <span class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>

        <label>Chuyên ngành</label>
        <select th:field="*{major}">
            <option value="">-- Chọn ngành --</option>
            <option th:each="m : ${majors}" th:value="${m}" th:text="${m}"></option>
        </select>
        <span class="error" th:if="${#fields.hasErrors('major')}" th:errors="*{major}"></span>

        <label>GPA</label>
        <input type="number" step="0.1" th:field="*{gpa}">
        <span class="error" th:if="${#fields.hasErrors('gpa')}" th:errors="*{gpa}"></span>

        <div class="form-actions">
            <button type="submit" class="btn">Lưu</button>
            <a th:href="@{/students}">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
